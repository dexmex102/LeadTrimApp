<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful — LeadTrim AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="bg-[#0A0E17] text-[#E6EAF2] min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full text-center">
    <!-- Success Icon -->
    <div class="mx-auto w-20 h-20 rounded-2xl bg-[#10B981]/10 flex items-center justify-center mb-8 ring-1 ring-[#10B981]/20">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-[#10B981]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9 2-9-2 9-2z" />
      </svg>
    </div>

    <!-- Heading -->
    <h1 class="text-4xl font-semibold tracking-tight mb-4">
      Payment Successful!
    </h1>

    <!-- Paragraph -->
    <p class="text-lg text-[#8A93A6] mb-10 leading-relaxed">
      Your credits have been added to your account.<br>
      Thank you for choosing LeadTrim!
    </p>

    <!-- Return Button -->
    <a href="https://leadtrim.company"
       class="inline-flex items-center justify-center gap-2 px-8 py-3.5 rounded-xl bg-[#10B981] hover:bg-[#0EA572] text-white font-semibold text-base transition-all active:scale-[0.985] shadow-lg shadow-black/30">
      <span>Return to Dashboard</span>
    </a>

    <div class="mt-8 text-xs text-[#8A93A6]/60">
      You can close this tab if you opened it from checkout.
    </div>
  </div>
</body>
</html>
